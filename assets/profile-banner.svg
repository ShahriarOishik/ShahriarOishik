<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Shahriar Oishik profile banner</title>
  <desc id="description">A colorful developer profile banner for Shahriar Oishik</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="48%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0" />
      <stop offset="50%" stop-color="#f0abfc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.08" />
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)" />
  <rect width="1200" height="300" rx="24" fill="url(#grid)" />
  <circle cx="1030" cy="50" r="120" fill="#f0abfc" fill-opacity="0.22" filter="url(#blur)" />
  <circle cx="180" cy="280" r="130" fill="#67e8f9" fill-opacity="0.18" filter="url(#blur)" />
  <path d="M0 238 C210 180 330 290 540 224 S920 150 1200 218" fill="none" stroke="url(#glow)" stroke-width="3" />
  <g fill="#ffffff" fill-opacity="0.7">
    <circle cx="960" cy="70" r="3" />
    <circle cx="1100" cy="150" r="4" />
    <circle cx="870" cy="218" r="2" />
    <circle cx="250" cy="74" r="3" />
  </g>
  <text x="72" y="128" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">Shahriar Oishik</text>
  <text x="76" y="174" fill="#e0e7ff" font-family="Arial, Helvetica, sans-serif" font-size="22">Full-Stack Developer  |  Exploring RAG Systems</text>
  <text x="76" y="218" fill="#fce7f3" font-family="Arial, Helvetica, sans-serif" font-size="16">Learning, building, and solving problems with code</text>
</svg>
