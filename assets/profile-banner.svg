<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Shahriar Oishik anime pixel quest profile banner</title>
  <desc id="description">An original 8-bit developer character in a neon mission-control scene.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b1a" />
      <stop offset="55%" stop-color="#17134a" />
      <stop offset="100%" stop-color="#3d123e" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0" />
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.07" />
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <style>
      .blink { animation: blink 1.5s steps(2, end) infinite; }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes blink { 50% { opacity: 0.25; } }
      @keyframes float { 50% { transform: translateY(-6px); } }
      @keyframes scan { from { transform: translateX(-180px); } to { transform: translateX(1180px); } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#background)" />
  <rect width="1200" height="340" rx="24" fill="url(#grid)" />
  <path d="M0 278H1200" stroke="#67e8f9" stroke-opacity="0.22" />
  <path class="scan" d="M0 54H180" stroke="url(#beam)" stroke-width="3" />
  <circle cx="1010" cy="82" r="100" fill="#ec4899" fill-opacity="0.18" filter="url(#glow)" />
  <circle cx="220" cy="300" r="110" fill="#67e8f9" fill-opacity="0.13" filter="url(#glow)" />

  <g fill="#ffffff">
    <rect class="blink" x="74" y="58" width="5" height="5" fill="#67e8f9" />
    <rect class="float" x="650" y="70" width="4" height="4" fill="#ec4899" />
    <rect class="blink" x="760" y="236" width="6" height="6" fill="#f9a8d4" />
    <rect class="float" x="1128" y="48" width="5" height="5" fill="#67e8f9" />
  </g>

  <g font-family="monospace" shape-rendering="crispEdges">
    <rect x="70" y="52" width="164" height="28" fill="#111827" stroke="#67e8f9" />
    <circle class="blink" cx="88" cy="66" r="5" fill="#a7f3d0" />
    <text x="104" y="71" fill="#a7f3d0" font-size="13" font-weight="700">SYSTEM ONLINE</text>

    <text x="70" y="148" fill="#ffffff" font-size="48" font-weight="700">SHAHRIAR OISHIK</text>
    <text x="74" y="184" fill="#67e8f9" font-size="20" font-weight="700">FULL-STACK / RAG / CODE QUEST</text>
    <text x="74" y="220" fill="#f9a8d4" font-size="15">Build with intent. Solve with style. Ship the next level.</text>

    <rect x="70" y="246" width="500" height="14" fill="#111827" stroke="#4f46e5" />
    <rect x="76" y="252" width="316" height="2" fill="#ec4899" />
    <text x="586" y="258" fill="#a5b4fc" font-size="12">XP: IN PROGRESS</text>
  </g>

  <!-- Original pixel-art developer avatar -->
  <g class="float" transform="translate(842 42)" shape-rendering="crispEdges">
    <rect x="0" y="0" width="292" height="224" fill="#0b1028" fill-opacity="0.78" stroke="#a855f7" stroke-width="2" />
    <path d="M18 34H72M220 34H274M18 190H72M220 190H274" stroke="#67e8f9" stroke-width="3" />
    <rect x="96" y="38" width="96" height="16" fill="#ec4899" />
    <rect x="78" y="54" width="132" height="18" fill="#172554" />
    <rect x="70" y="72" width="148" height="78" fill="#f6c7a8" />
    <rect x="78" y="62" width="132" height="18" fill="#111827" />
    <rect x="62" y="80" width="18" height="48" fill="#111827" />
    <rect x="210" y="80" width="18" height="48" fill="#111827" />
    <rect x="86" y="90" width="22" height="12" fill="#ffffff" />
    <rect x="180" y="90" width="22" height="12" fill="#ffffff" />
    <rect class="blink" x="96" y="94" width="9" height="8" fill="#4f46e5" />
    <rect class="blink" x="183" y="94" width="9" height="8" fill="#4f46e5" />
    <rect x="132" y="112" width="22" height="8" fill="#ec4899" />
    <rect x="116" y="124" width="54" height="8" fill="#9f1239" />
    <rect x="116" y="150" width="56" height="20" fill="#f6c7a8" />
    <path d="M54 224V188L86 166H206L238 188V224Z" fill="#312e81" />
    <path d="M76 224V188L112 174H180L216 188V224Z" fill="#4f46e5" />
    <rect x="120" y="188" width="52" height="18" fill="#111827" stroke="#67e8f9" />
    <rect class="blink" x="128" y="195" width="9" height="4" fill="#67e8f9" />
    <rect x="145" y="195" width="19" height="4" fill="#ec4899" />
    <rect x="12" y="12" width="10" height="10" fill="#ec4899" />
    <rect x="270" y="202" width="10" height="10" fill="#67e8f9" />
  </g>

  <g font-family="monospace" font-size="12" font-weight="700">
    <text x="870" y="296" fill="#67e8f9">QUEST 01 // RAG SYSTEMS</text>
    <text x="1084" y="296" fill="#ec4899">LV. BUILD</text>
  </g>
</svg>
